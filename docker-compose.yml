version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - appnet

  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  nest-api:
    build: ./services/nest-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/weather
      - JWT_SECRET=${JWT_SECRET:-change_me}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      - DEFAULT_ADMIN_PASS=${DEFAULT_ADMIN_PASS:-123456}
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - appnet

  go-worker:
    build: ./services/go-worker
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_QUEUE=weather_queue
      - NEST_API_URL=http://nest-api:3000
      - WORKER_MAX_RETRIES=3
      - WORKER_HTTP_TIMEOUT_SECONDS=10
    depends_on:
      - rabbitmq
      - nest-api
    restart: unless-stopped
    networks:
      - appnet

  weather-producer:
    build: ./services/python-producer
    environment:
      - LAT=-22.12556
      - LON=-51.38889
      - CITY=Presidente Prudente
      - INTERVAL_SECONDS=3600
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_QUEUE=weather_queue
    depends_on:
      - rabbitmq
    restart: unless-stopped
    networks:
      - appnet

  frontend:
    build:
      context: ./services/frontend
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - nest-api

volumes:
  mongo-data:

networks:
  appnet:
    driver: bridge
