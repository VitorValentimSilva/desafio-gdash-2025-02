version: "3.8"
services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  weather-producer:
    build: .
    depends_on:
      - rabbitmq
    environment:
      - LAT=-23.55052
      - LON=-46.633308
      - CITY=São Paulo
      - INTERVAL_SECONDS=3600
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - RABBITMQ_QUEUE=weather_queue
